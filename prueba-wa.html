<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prueba WhatsApp</title>
<style>
  body { margin: 0; padding: 20px 16px 40px; background: #0b0b14; color: #eee; font: 16px/1.4 system-ui, sans-serif; }
  h1 { font-size: 1.2rem; margin: 0 0 6px; }
  p { color: #aaa; font-size: .9rem; margin: 0 0 18px; }
  button { display: block; width: 100%; margin: 0 0 12px; padding: 16px; border: 0; border-radius: 14px;
           background: #25D366; color: #fff; font: 600 1rem system-ui, sans-serif; text-align: left; }
  button small { display: block; font-weight: 400; opacity: .85; margin-top: 2px; }
  button:disabled { opacity: .5; }
  #log { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; color: #9ad; background: #111827; padding: 10px; border-radius: 10px; }
</style>
</head>
<body>
<h1>Prueba de envío por WhatsApp</h1>
<p>Espera a que diga "listo" abajo. Luego prueba cada botón, envíatelo a ti mismo o a un contacto de confianza, y apunta qué letra funciona.</p>
<button data-v="A" disabled>A · Audio M4A + texto<small>Nombre con tildes (como ahora)</small></button>
<button data-v="B" disabled>B · Audio M4A solo<small>Nombre simple, sin texto</small></button>
<button data-v="C" disabled>C · Audio MP3 solo<small>Nombre simple, sin texto</small></button>
<button data-v="D" disabled>D · Audio M4A + texto<small>Nombre simple</small></button>
<div id="log"></div>
<script>
(function () {
  var BASE = 'https://media.nabookiestranslations.org/es/11-20';
  var URL_PAG = 'https://grey-book-reflections.nabookiestranslations.org/20-de-Noviembre/';
  var TEXTO = 'Reflexión Libro Gris – 20 de Noviembre\n' + URL_PAG;
  var log = document.getElementById('log');
  function L(t) { log.textContent += t + '\n'; }
  L('navegador: ' + navigator.userAgent);
  L('share: ' + !!navigator.share + ' · canShare: ' + !!navigator.canShare);
  var blobs = {};
  function traer(ext) {
    return fetch(BASE + '.' + ext).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); });
  }
  var variantes = {
    A: { ext: 'm4a', tipo: 'audio/mp4', nombre: 'Reflexión Libro Gris – 20 de Noviembre - ES.m4a', texto: true },
    B: { ext: 'm4a', tipo: 'audio/mp4', nombre: 'Reflexion-Libro-Gris-20-Noviembre.m4a', texto: false },
    C: { ext: 'mp3', tipo: 'audio/mpeg', nombre: 'Reflexion-Libro-Gris-20-Noviembre.mp3', texto: false },
    D: { ext: 'm4a', tipo: 'audio/mp4', nombre: 'Reflexion-Libro-Gris-20-Noviembre.m4a', texto: true },
  };
  Promise.all([traer('m4a'), traer('mp3')]).then(function (r) {
    blobs.m4a = r[0]; blobs.mp3 = r[1];
    L('listo: m4a ' + r[0].size + ' B, mp3 ' + r[1].size + ' B');
    document.querySelectorAll('button').forEach(function (b) { b.disabled = false; });
  }, function (e) { L('ERROR al descargar: ' + e); });
  document.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = variantes[b.dataset.v];
      var f = new File([blobs[v.ext]], v.nombre, { type: v.tipo });
      var datos = v.texto ? { files: [f], text: TEXTO } : { files: [f] };
      var ok = navigator.canShare && navigator.canShare(datos);
      L(b.dataset.v + ': canShare=' + ok);
      if (!ok) return;
      navigator.share(datos).then(function () { L(b.dataset.v + ': compartido'); },
        function (e) { L(b.dataset.v + ': ' + e.name + ' ' + e.message); });
    });
  });
})();
</script>
</body>
</html>
